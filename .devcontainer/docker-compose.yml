# Full-stack dev environment for Codespaces / devcontainers.
#
# Runs the real Electron app with a virtual display accessible via noVNC.
#
# Services:
#   - Workspace container with Node 20, Electron deps, Xvfb, noVNC
#
# Ports:
#   - 5173  App Vite dev server (HMR)
#   - 6080  noVNC — see the Electron app in your browser
#   - 9825  CDP remote debugging (for Chrome MCP / automation)
#
# MySQL and the Den environment variables were removed with the ee/ cloud
# control plane; nothing here talks to it any more.

services:
  workspace:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    ports:
      - "5173:5173"
      - "6080:6080"
      - "9825:9825"
    environment:
      # Display
      DISPLAY: ":99"
      ELECTRON_DISABLE_SANDBOX: "1"
      # Electron CDP debugging
      OPENWORK_ELECTRON_REMOTE_DEBUG_PORT: "9825"
      OPENWORK_DEV_MODE: "1"
      CORS_ORIGINS: http://localhost:5173
    command: sleep infinity