services:
  openwork-host:
    build:
      # The server is built from this repository (this fork is not on npm).
      context: ..
      dockerfile: packaging/docker/Dockerfile
      args:
        # Keep in sync with constants.json (opencodeVersion).
        OPENCODE_VERSION: 1.18.30
        # Optional: serve the engine binary from your own mirror.
        # OPENCODE_DOWNLOAD_URL: "https://your-mirror/opencode-linux-x64-baseline.tar.gz"
    ports:
      - "8787:8787"
    environment:
      # Set these explicitly for stable sharing.
      # OPENWORK_TOKEN: "..."
      # OPENWORK_HOST_TOKEN: "..."
      # Optional: OPENWORK_APPROVAL_MODE: "auto"
      # Optional: OPENWORK_APPROVAL_TIMEOUT_MS: "30000"
      # Historical path retained so existing ./data volumes keep working.
      # Only a directory name; the orchestrator CLI itself is gone.
      OPENWORK_DATA_DIR: /data/openwork-orchestrator
      OPENWORK_SIDECAR_DIR: /data/sidecars
    volumes:
      # Mount an existing project/workspace here.
      - ./workspace:/workspace
      # Persistent host data (OpenCode caches, server config, tokens).
      - ./data:/data
